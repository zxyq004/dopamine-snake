<html lang="zh-CN">
<head>

<title>多巴胺 3D 贪吃蛇</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;position:fixed;background:#0b0720;

canvas{display:block;position:fixed;inset:0;touch-action:none}

.box.r{text-align:right}.box.r b{text-shadow:0 0 14px #34e0ff}
#lives{font-size:13px;letter-spacing:1px;line-height:1.2;margin-top:1px;min-height:16px}
#score.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#score.dbl{color:#ffd23f;text-shadow:0 0 16px #ff9a1f}

#cbox{text-align:center;opacity:0;transition:opacity .2s;margin-top:4px}

#barI{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4fb8,#fff35c);transform-origin:left}
#fxbox{position:fixed;top:calc(86px + env(safe-area-inset-top));left:14px;z-index:2;pointer-events:none;
  display:flex;flex-direction:column;gap:5px}
.fxrow{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;color:#ffd23f;
  text-shadow:0 0 8px #ff9a1f;animation:fxin .25s}
.fxrow .fe{font-size:19px;line-height:1}
@keyframes fxin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.dbar{width:84px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:2px;overflow:hidden}
.dbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#34e0ff,#ffd23f);transform-origin:left}
#btns{display:flex;gap:6px;margin-top:4px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
#btns button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(10,5,30,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:3}
#ov .panel{max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel{text-align:center;padding:26px 30px;max-width:92vw;border-radius:24px;
  background:linear-gradient(160deg,rgba(60,25,120,.75),rgba(20,10,60,.8));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 40px rgba(255,79,184,.35),0 0 80px rgba(52,224,255,.18)}
h1{margin:0 0 4px;font-size:clamp(30px,8vw,46px);font-weight:900;
  background:linear-gradient(90deg,#ff4fb8,#fff35c,#34e0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,79,184,.6))}
.sub{letter-spacing:4px;font-size:12px;color:#b9a8ff;margin-bottom:16px}
.tips{list-style:none;padding:0;margin:0 0 18px;text-align:left;font-size:13px;line-height:1.75;color:#e8e0ff}
.tips b{color:#fff35c}
.big{font-size:54px;font-weight:900;color:#fff35c;text-shadow:0 0 20px #ff9a1f;margin:6px 0}
.row{color:#cfc4ff;margin:4px 0}.new{color:#ff4fb8;font-weight:900;font-size:18px;animation:pop .6s infinite alternate}
.go{margin-top:14px;padding:12px 34px;font-size:18px;font-weight:900;color:#1a0b3a;border:0;border-radius:30px;
  cursor:pointer;background:linear-gradient(90deg,#fff35c,#ff4fb8);
  box-shadow:0 0 22px rgba(255,79,184,.7);font-family:inherit}
.go:active{transform:scale(.95)}
.go.alt{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:15px;padding:10px 22px;margin-left:8px}
.sec{margin:12px 0 4px;font-size:13px;font-weight:900;letter-spacing:1px;color:#b9a8ff;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 6px}
.chip{padding:6px 11px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
  color:#fff;font-size:13px;font-family:inherit;cursor:pointer;line-height:1.3}
.chip.on{background:linear-gradient(90deg,#fff35c,#ff4fb8);color:#1a0b3a;font-weight:900;border-color:transparent}
.chip.lock{opacity:.55;cursor:default;display:inline-block}
.chip small{display:block;font-size:10px;opacity:.85;letter-spacing:0;color:inherit}
.hint{font-size:12px;color:#cfc4ff;margin:2px 0 4px}
.lbrow,.lb{display:flex;justify-content:space-between;gap:16px;font-size:14px;padding:3px 10px;border-radius:10px;color:#e8e0ff}
.lbrow.me,.lb.me{background:rgba(255,243,92,.16);color:#fff35c;font-weight:900}
.lbrow b,.lb b{color:#fff35c}
.lbbox{max-width:260px;margin:4px auto}
.qrow{margin:6px auto;max-width:280px;text-align:left}
.qt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#e8e0ff}
.qt b{color:#7dffd4;white-space:nowrap}
.qbar{height:6px;border-radius:4px;background:rgba(255,255,255,.15);margin-top:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#34e0ff,#7dffd4)}
.unl{color:#7dffd4;font-weight:900;margin:6px 0;font-size:14px}
#boost{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:2;width:64px;height:64px;
  border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,79,184,.22);
  color:#fff;font-size:26px;font-family:inherit;touch-action:none}
#boost.on{background:rgba(255,79,184,.55);box-shadow:0 0 24px rgba(255,79,184,.8)}
#setp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(10,5,30,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:4}
#setp .panel{min-width:min(300px,86vw)}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#e8e0ff;font-size:15px;gap:12px}
.srow b{color:#fff35c}
.tog{min-width:64px;padding:5px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);
  color:#fff;font-size:13px;font-family:inherit;cursor:pointer}
.tog.on{background:linear-gradient(90deg,#fff35c,#ff4fb8);color:#1a0b3a;font-weight:900;border-color:transparent}
#setp input[type=range]{width:100%;margin:8px 0 12px;accent-color:#ff4fb8}
#setp .tips{margin-bottom:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="box"><small>得分</small><b id="score">0</b><div id="lives"></div></div>
  <div id="cbox"><div id="combo">连击 ×1</div><div id="bar"><i id="barI"></i></div></div>
  <div style="display:flex;gap:12px;align-items:flex-start">
    <div class="box r"><small id="blabel">最高分</small><b id="best">0</b></div>
    <div id="btns"><button id="bPause" title="暂停">⏸</button><button id="bSnd" title="音效">🔊</button><button id="bMus" title="音乐">🎵</button><button id="bSet" title="设置">⚙️</button></div>
  </div>
</div>
<div id="fxbox"></div>
<button id="boost" title="按住加速">⏩</button>
<div id="setp"><div class="panel">
  <h1 style="font-size:28px">设置</h1><div class="sub">SETTINGS</div>
  <div class="srow"><span>游戏速度</span><b id="spdVal">×1.0</b></div>
  <input id="spd" type="range" min="0.5" max="2" step="0.1" value="1">
  <div class="srow"><span>❤️ 一命模式（硬核）</span><button class="tog" id="tOne">关</button></div>
  <div class="srow"><span>📳 震动反馈</span><button class="tog" id="tVib">开</button></div>
  <div class="tips" style="text-align:center">向左更慢 · 向右更快<br>按住右侧 ⏩ 按钮可临时加速<br>命数设置在下一局生效</div>
  <button class="go" id="setClose">完成</button>
</div></div>
<div id="ov"></div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const scoreEl=$('score'),bestEl=$('best'),cbox=$('cbox'),comboEl=$('combo'),
      barI=$('barI'),ov=$('ov'),setp=$('setp'),spd=$('spd'),spdVal=$('spdVal'),bBoost=$('boost'),
      fxbox=$('fxbox'),livesEl=$('lives'),blabel=$('blabel');
const N=20,NY=40,D=52,COMBO_MS=3200;
const TOUCH=('ontouchstart'in window)||((navigator.maxTouchPoints||0)>0);
let W,H,DPR,F,CY,SN,CS,gp=[];
if(TOUCH)document.body.classList.add('touch');
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* ===== 皮肤 / 主题 ===== */
const SKINS=[
  {id:'classic',e:'🐍',name:'经典',txt:'默认',ok:p=>true,prog:p=>''},
  {id:'panda',e:'🐼',name:'熊猫',txt:'获得5个成就',ok:p=>p.achv.length>=5,prog:p=>p.achv.length+'/5'},
  {id:'rainbow',e:'🌈',name:'彩虹',txt:'集齐8种道具',ok:p=>p.pu.length>=8,prog:p=>p.pu.length+'/8'},
  {id:'dragon',e:'🐉',name:'神龙',txt:'最高分达到5000',ok:p=>p.best>=5000,prog:p=>p.best+'/5000'},
  {id:'neon',e:'💠',name:'霓虹',txt:'获得8个成就',ok:p=>p.achv.length>=8,prog:p=>p.achv.length+'/8'},
  {id:'flame',e:'🔥',name:'烈焰',txt:'集齐12种道具',ok:p=>p.pu.length>=12,prog:p=>p.pu.length+'/12'},
  {id:'frost',e:'❄️',name:'寒冰',txt:'最高分达到3500',ok:p=>p.best>=3500,prog:p=>p.best+'/3500'},
  {id:'gold',e:'👑',name:'鎏金',txt:'最高分达到8000',ok:p=>p.best>=8000,prog:p=>p.best+'/8000'}
];
const THEMES=[
  {id:'purple',e:'🟣',name:'紫夜',txt:'默认',ok:p=>true,prog:p=>'',
   bg:['#0b0720','#1c0b40'],floor:['#2b1366','#1a0a48'],back:['#3a1a8a','#12072e'],
   chk:'rgba(150,110,255,.16)',grid:'rgba(170,150,255,.14)',glow:'rgba(120,70,255,',orbs:[330,190,52,270]},
  {id:'ocean',e:'🌊',name:'海洋蓝',txt:'获得3个成就',ok:p=>p.achv.length>=3,prog:p=>p.achv.length+'/3',
   bg:['#02111f','#05294a'],floor:['#0b4a7a','#06304f'],back:['#0f6aa0','#04233d'],
   chk:'rgba(80,200,255,.16)',grid:'rgba(120,220,255,.15)',glow:'rgba(40,160,255,',orbs:[195,175,210,160]},
  {id:'sakura',e:'🌸',name:'樱花粉',txt:'最高分达到2000',ok:p=>p.best>=2000,prog:p=>p.best+'/2000',
   bg:['#2a0a1f','#4a1236'],floor:['#7a2a5e','#4f1a3d'],back:['#a8407f','#3a1230'],
   chk:'rgba(255,170,215,.17)',grid:'rgba(255,190,225,.16)',glow:'rgba(255,100,170,',orbs:[335,350,320,15]},
  {id:'obsidian',e:'⬛',name:'曜石黑',txt:'获得10个成就',ok:p=>p.achv.length>=10,prog:p=>p.achv.length+'/10',
   bg:['#050508','#0e0e1a'],floor:['#1b1b2e','#11111f'],back:['#262640','#0a0a14'],
   chk:'rgba(255,255,255,.05)',grid:'rgba(160,160,255,.07)',glow:'rgba(150,150,255,',orbs:[230,250,270,50]},
  {id:'mint',e:'🌿',name:'薄荷绿',txt:'集齐10种道具',ok:p=>p.pu.length>=10,prog:p=>p.pu.length+'/10',
   bg:['#04160f','#0a3524'],floor:['#0e5238','#093626'],back:['#127a50','#062a1d'],
   chk:'rgba(120,255,190,.13)',grid:'rgba(140,255,205,.12)',glow:'rgba(60,255,170,',orbs:[150,130,165,95]},
  {id:'sunset',e:'🌅',name:'落日橙',txt:'最高分达到4000',ok:p=>p.best>=4000,prog:p=>p.best+'/4000',
   bg:['#1e0a05','#3c1508'],floor:['#6e2c12','#4c1c0c'],back:['#93401c','#2f1006'],
   chk:'rgba(255,180,100,.14)',grid:'rgba(255,200,130,.13)',glow:'rgba(255,140,60,',orbs:[25,35,15,48]}
];
/* ===== 家庭玩家（localStorage: dopamine_snake_players） ===== */
const PKEY='dopamine_snake_players';
function mkPlayer(name){
  return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name,best:0,achv:[],pu:[],skin:'classic',theme:'purple',unl:['classic','purple']};
}
function loadDB(){
  let o=null;try{o=JSON.parse(lsGet(PKEY))}catch(e){}
  if(!o||!Array.isArray(o.list)||!o.list.length){
    const p=mkPlayer('玩家1');
    p.best=parseInt(lsGet('dopamine_snake_best'))||0;
    try{p.achv=JSON.parse(lsGet('dopamine_snake_achv')||'[]')}catch(e){}
    try{p.pu=JSON.parse(lsGet('dopamine_snake_pu')||'[]')}catch(e){}
    p.unl=null;
    o={list:[p],cur:p.id};
  }
  o.list=o.list.slice(0,5);
  o.list.forEach(p=>{
    p.name=String(p.name||'玩家').slice(0,8);p.best=+p.best||0;
    if(!Array.isArray(p.achv))p.achv=[];
    if(!Array.isArray(p.pu))p.pu=[];
    if(!p.skin)p.skin='classic';
    if(!p.theme)p.theme='purple';
    if(!Array.isArray(p.unl)){p.unl=[];SKINS.concat(THEMES).forEach(s=>{if(s.ok(p))p.unl.push(s.id)})}
  });
  if(!o.list.some(p=>p.id===o.cur))o.cur=o.list[0].id;
  return o;
}
let DB=loadDB();
function saveDB(){lsSet(PKEY,JSON.stringify(DB))}
function cp(){return DB.list.find(p=>p.id===DB.cur)||DB.list[0]}
saveDB();
let SKIN='classic',TH=THEMES[0],puGot=[],achvUnlocked=[],best=0,lastUnl=[];
function applyVis(){
  const p=cp();
  let s=SKINS.find(o=>o.id===p.skin);if(!s||p.unl.indexOf(s.id)<0)s=SKINS[0];
  let t=THEMES.find(o=>o.id===p.theme);if(!t||p.unl.indexOf(t.id)<0)t=THEMES[0];
  SKIN=s.id;TH=t;
}
function bindPlayer(){
  const p=cp();puGot=p.pu;achvUnlocked=p.achv;best=p.best;
  bestEl.textContent=best;blabel.textContent='最高分·'+p.name;
  applyVis();
}
function checkUnlocks(silent){
  const p=cp(),got=[];
  SKINS.concat(THEMES).forEach(o=>{
    if(o.ok(p)&&p.unl.indexOf(o.id)<0){
      p.unl.push(o.id);got.push(o);
      if(!silent){
        lastUnl.push(o.e+o.name);
        if(typeof texts!=='undefined'){
          texts.push({x:W/2,y:H*.56,txt:'🔓 解锁 '+o.e+o.name+'！',col:'#7dffd4',t:0,life:2000,size:36,big:true});
          fanfare();
        }
      }
    }
  });
  if(got.length)saveDB();
  return got;
}
/* ===== 设置状态 ===== */
const DIFFS={relax:{e:'🐢',name:'悠闲',sp:.8,hint:'速度×0.8 · 开局自带护盾 · 3条命'},
  classic:{e:'😎',name:'经典',sp:1,hint:'原汁原味的手感 · 3条命'},
  extreme:{e:'🔥',name:'极限',sp:1.25,hint:'速度×1.25 · 强制一命模式'}};
let diff=lsGet('dopamine_snake_diff');if(!DIFFS[diff])diff='classic';
let oneLife=lsGet('dopamine_snake_onelife')==='1';
let vibOn=lsGet('dopamine_snake_vib')!=='0';
function vib(p){
  if(!vibOn)return;
  try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}
}
/* ===== 音频 ===== */
let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function unlockAudio(){const a=ac();if(a&&a.state==='suspended'){try{a.resume()}catch(e){}}}
document.addEventListener('WeixinJSBridgeReady',unlockAudio,false);
function tone(f,d,type,v,t0,f2){
  const a=ac();if(!a||muted)return;
  const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const PENTA=[523,587,659,784,880,1047,1175,1319];
function sfxCombo(c){const n=Math.min(c,6);for(let i=0;i<n;i++)tone(PENTA[Math.min(i+Math.max(0,c-4),7)],.14,'square',.07,i*.055)}
function sfxOver(){tone(440,.55,'sawtooth',.16,0,90);tone(330,.7,'square',.09,.12,60)}
function sfxStart(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'triangle',.14,i*.07))}
function sfxLife(){tone(330,.3,'sawtooth',.14,0,110);tone(196,.4,'square',.1,.1,90)}
let evoTier=0;
function growthTier(){return Math.min(5,Math.floor((snake.length-3)/5))}
function sfxEvolve(tier){
  const base=[523,587,659,784,880,1047],n=3+Math.min(tier,3);
  for(let i=0;i<n;i++)tone(base[i%base.length]*2,.16,'triangle',.16,i*.07);
  tone(220,.5,'sawtooth',.1,0,880);
  if(tier>=4)for(let i=0;i<8;i++)tone(1047+i*120,.1,'square',.06,.1+i*.05);
}
const EAT_STYLES=[
  c=>{const b=520+c*30;tone(b,.12,'triangle',.25,0,b*2.2);tone(b*2,.08,'sine',.1,.02)},
  c=>{const b=440+c*25;[0,4,7,12].forEach((iv,i)=>tone(b*Math.pow(2,iv/12),.1,'square',.09,i*.045))},
  c=>{const b=600+c*20;tone(b,.2,'sine',.22,0,b*.4);tone(b*1.5,.12,'triangle',.14,.05,b*2.5)},
  c=>{const b=700+c*35;tone(b,.16,'sawtooth',.1,0,b*3);tone(b*1.26,.1,'sine',.12,.03)}
];
let eatStyle=0;
function sfxEat(c){
  EAT_STYLES[eatStyle%EAT_STYLES.length](c);eatStyle++;
  const tier=growthTier(),b=300+tier*60+c*20;
  tone(90,.3,'sine',.3,0,45);
  tone(b,.4,'sawtooth',.08,.02,b*3);
  for(let i=0;i<=Math.min(tier,4);i++)tone(b*(2+i*.5),.12,'square',.07,.05+i*.06);
  if(tier>=2)tone(1200,.2,'sine',.08,.1,2400);
  if(advanced)tone(b*4,.12,'sine',.06,.12);
  shake+=4+tier*2;
}
let cheerBuf=null,cheerUntil=0,cheerLvl=0;
function cheerNoise(){
  if(cheerBuf)return cheerBuf;
  const a=ac(),len=(a.sampleRate*2)|0,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;l=l*.6+w*.4;d[i]=l*1.6}
  return cheerBuf=b;

    if(Math.abs(s.x-o.x)>1||Math.abs(s.y-o.y)>1)return{x:s.x,y:s.y};

function wd(d,m){d=((d%m)+m)%m;return d>m/2?d-m:d}
function magnetStep(){
  const h=snake[0];
  const dx=wd(h.x-food.x,N),dy=wd(h.y-food.y,NY);
  if(!dx&&!dy)return;
  const ax=[Math.sign(dx),0],ay=[0,Math.sign(dy)];
  const opts=Math.abs(dx)>=Math.abs(dy)?[ax,ay]:[ay,ax];
  for(const o of opts){
    if(!o[0]&&!o[1])continue;
    const x=(food.x+o[0]+N)%N,y=(food.y+o[1]+NY)%NY;
    if(x===h.x&&y===h.y){
      const t=snake[snake.length-1];
      snake.push({x:t.x,y:t.y});prev.push({x:t.x,y:t.y});
      food.x=x;food.y=y;eat();return;
    }
    if(snake.some(s=>s.x===x&&s.y===y)||(pu&&pu.x===x&&pu.y===y))continue;
    food.x=x;food.y=y;return;
  }
}

  wall([-N/2,-NY/2],[-N/2,NY/2],'rgba(52,224,255,.2)','#34e0ff');
  wall([N/2,-NY/2],[N/2,NY/2],'rgba(255,243,92,.2)','#fff35c');
  const n=snake.length,vis=snake.map((s,i)=>{const p=prev[i]||s;return{x:p.x+(s.x-p.x)*alpha-9.5,y:p.y+(s.y-p.y)*alpha-19.5}});
  const rb=active('rainbow'),gh=active('ghost'),mt=active('meteor'),mg=active('magnet'),rs=active('respawn');
  if(state==='play'&&!dead){
    if(dblOn&&Math.random()<.45){
      const q=P(vis[0].x,vis[0].y,.6);
      parts.push({x:q[0]+rnd(-12,12),y:q[1]+rnd(-12,12),vx:rnd(-.6,.6),vy:rnd(-2,-.5),life:rnd(400,800),t:0,r:rnd(2,4),h:rnd(40,60),shape:'star',rot:0,vr:0,sd:0});
    }
    if(rb&&Math.random()<.9){
      const s=vis[(Math.random()*n)|0],q=P(s.x,s.y,.5);
      parts.push({x:q[0]+rnd(-4,4),y:q[1]+rnd(-4,4),vx:rnd(-.5,.5),vy:rnd(-1.2,.2),life:rnd(500,900),t:0,r:rnd(2.5,4.5),h:rnd(0,360)});
    }
    if(mt){
      const q=P(vis[0].x,vis[0].y,.5);
      for(let k=0;k<2;k++)parts.push({x:q[0]+rnd(-6,6),y:q[1]+rnd(-6,6),vx:rnd(-.8,.8),vy:rnd(-.5,1.5),life:rnd(300,600),t:0,r:rnd(3,5.5),h:rnd(10,48)});
    }
    if(SKIN!=='classic'&&Math.random()<.22){
      const s=vis[(Math.random()*n)|0],q=P(s.x,s.y,.5),sp=skinPart();
      if(sp){
        if(SKIN==='dragon'&&Math.random()<.6){
          const hq=P(vis[0].x+dir.x*.4,vis[0].y+dir.y*.4,.6);
          parts.push({x:hq[0],y:hq[1],vx:dir.x*rnd(1,3)+rnd(-.4,.4),vy:dir.y*rnd(1,2.5)*CS-rnd(.3,1),life:rnd(300,600),t:0,r:rnd(2.5,4.5),h:rnd(5,45),s:100});
        }else parts.push({x:q[0]+rnd(-4,4),y:q[1]+rnd(-4,4),vx:rnd(-.5,.5),vy:rnd(-1.4,-.2),life:rnd(500,900),t:0,r:rnd(2,4),h:sp.h,s:sp.s,shape:Math.random()<.5?'star':undefined,rot:0,vr:0,sd:0});
      }
    }
  }
  const bob=Math.sin(t*3.2)*.16,fz=.85+bob;
  shadow(food.x-9.5,food.y-19.5,.42,fz);
  if(pu)shadow(pu.x-9.5,pu.y-19.5,.42,fz);
  vis.forEach((v,i)=>shadow(v.x,v.y,i?0.44:0.5,0));
  {const p=P(food.x-9.5,food.y-19.5,0),fh=food.lucky?(t*220)%360:food.hue,R=(.55+.12*Math.sin(t*5))*p[2]*(food.lucky?1.25:1);
   ctx.save();ctx.translate(p[0],p[1]);ctx.scale(1,CS);ctx.strokeStyle=hsl(fh,100,65,.65);ctx.lineWidth=food.lucky?3:2;
   ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();ctx.restore()}
  if(mg&&!dead){
    const a=P(vis[0].x,vis[0].y,.6),b=P(food.x-9.5,food.y-19.5,fz);
    ctx.save();ctx.strokeStyle='rgba(52,224,255,.55)';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.lineDashOffset=-t*30;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore();
  }
  const items=[];
  items.push({y:food.y-19.5,f:()=>{
    const fx0=food.x-9.5,fy=food.y-19.5;
    if(food.lucky){
      sph(fx0,fy,.47,(t*220)%360,fz);
      for(let k=0;k<4;k++){
        const ang=t*3+k*Math.PI/2,q=P(fx0+Math.cos(ang)*.78,fy+Math.sin(ang)*.78,fz+.05);
        ctx.fillStyle=hsl(t*200+k*90,100,72,.95);starPath(q[0],q[1],q[2]*.2);ctx.fill();
      }
    }else sph(fx0,fy,.4,food.hue+Math.sin(t*4)*10,fz);
  }});
  if(pu)items.push({y:pu.y-19.5,f:()=>{
    if(pu.ttl<1800&&!active('freeze')&&Math.floor(t*8)%2)return;
    const d=pu.d,px0=pu.x-9.5,py0=pu.y-19.5;
    const p=P(px0,py0,fz),R=p[2]*.46;
    ctx.save();ctx.translate(p[0],p[1]);ctx.scale(1,CS);
    ctx.strokeStyle=d.col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,p[2]*.66,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,pu.ttl/pu.max));ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation='lighter';
    const pg=ctx.createRadialGradient(p[0],p[1],1,p[0],p[1],R*2.2);
    pg.addColorStop(0,hsl(d.hue,100,75,.55));pg.addColorStop(1,hsl(d.hue,100,60,0));
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p[0],p[1],R*2.2,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    sph(px0,py0,.44,d.hue,fz);
    ctx.font=(R*1.3|0)+'px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(d.e,p[0],p[1]+1);
    for(let k=0;k<3;k++){
      const ang=t*4+k*2.094,q=P(px0+Math.cos(ang)*.76,py0+Math.sin(ang)*.76,fz+.1);
      ctx.fillStyle=hsl(d.hue,100,80,.95);starPath(q[0],q[1],q[2]*.16);ctx.fill();
    }
  }});
  for(let i=n-1;i>=0;i--){
    const v=vis[i];
    let h,sat,dl;
    if(rb)h=t*260-i*26;
    else if(dblOn)h=48+Math.sin(t*6-i*.45)*28;
    else if(SKIN==='panda'){h=0;sat=6;dl=(i%2&&i!==0)?-42:22}
    else if(SKIN==='rainbow')h=t*260-i*26;
    else if(SKIN==='dragon')h=i===0?6:(i%5===0?46:(128+Math.sin(i*.6+t*2)*10));
    else if(SKIN==='neon')h=195+Math.sin(t*5-i*.35)*35;
    else if(SKIN==='flame')h=12+Math.sin(t*9-i*.6)*16;
    else if(SKIN==='frost'){h=200+Math.sin(i*.5)*12;sat=65}
    else if(SKIN==='gold'){h=46;sat=100;dl=Math.sin(t*3+i)*8}
    else h=320-i*17-t*40;
    const tp=(i>=n-3)?(0.78+0.22*(n-1-i)/3):1;
    const r=i?(0.44*tp):0.5;
    items.push({y:v.y,f:()=>{
      if(gh)ctx.globalAlpha=.55;
      if(rs&&Math.floor(t*12)%2)ctx.globalAlpha=.25;
      if(i===0){
        const px=-dir.y,py=dir.x;
        if(!rb&&!dblOn&&(SKIN==='panda'||SKIN==='dragon')){
          for(const sd of[-1,1]){
            if(SKIN==='panda')sph(v.x+px*.32*sd,v.y+py*.32*sd,.17,0,r*1.55,6,-42);
            else sph(v.x+px*.26*sd-dir.x*.12,v.y+py*.26*sd-dir.y*.12,.13,46,r*1.7,100,0);
          }
        }
        sph(v.x,v.y,r,h,undefined,sat,dl);
        for(const sd of[-1,1])eye(v.x+dir.x*.25+px*.2*sd,v.y+dir.y*.25+py*.2*sd,r*1.05+.12,dir.x,dir.y,1);
        if(shield&&!dead){
          const q=P(v.x,v.y,r);
          ctx.strokeStyle='rgba(120,210,255,'+(.6+.25*Math.sin(t*8)).toFixed(3)+')';ctx.lineWidth=3;
          ctx.beginPath();ctx.arc(q[0],q[1],r*q[2]*1.9,0,7);ctx.stroke();
        }
      }else sph(v.x,v.y,r,h,undefined,sat,dl);
      ctx.globalAlpha=1;
    }});
    if(i<n-1){
      const g0=snake[i],g1=snake[i+1];
      if(Math.abs(g0.x-g1.x)<=1&&Math.abs(g0.y-g1.y)<=1){
        const u=vis[i+1];
        items.push({y:(v.y+u.y)/2,f:()=>{
          if(gh)ctx.globalAlpha=.55;
          if(rs&&Math.floor(t*12)%2)ctx.globalAlpha=.25;
          sph((v.x+u.x)/2,(v.y+u.y)/2,r*.93,h+8,undefined,sat,dl);
          ctx.globalAlpha=1;
        }});
      }
    }
  }
  items.sort((a,b)=>a.y-b.y);items.forEach(o=>o.f());
  {const a1=P(-N/2,NY/2,0),b1=P(N/2,NY/2,0),a2=P(-N/2,NY/2,.7),b2=P(N/2,NY/2,.7);
   ctx.beginPath();quadPath(a1,b1,b2,a2);ctx.fillStyle='rgba(52,224,255,.13)';ctx.fill();
   ctx.save();ctx.shadowColor='#34e0ff';ctx.shadowBlur=14;ctx.strokeStyle='#34e0ff';ctx.lineWidth=2.5;
   ctx.beginPath();ctx.moveTo(a2[0],a2[1]);ctx.lineTo(b2[0],b2[1]);ctx.stroke();ctx.restore()}
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt;
    if(r.t<0)continue;
    const k=r.t/500;
    if(k>=1){rings.splice(i,1);continue}
    ctx.strokeStyle=hsl(r.hue,100,70,1-k);ctx.lineWidth=4*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,10+k*70,0,7);ctx.stroke();
  }
  ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue}
    if(p.shape==='rect'){
      p.vy=Math.min(p.vy+0.03,2.4);
      p.x+=Math.sin((p.t+(p.sd||0))*0.008)*0.9;
      p.rot+=(p.vr||0)*dt/1000;
    }else{
      p.vy+=.22;p.vx*=.985;
    }
    p.x+=p.vx;p.y+=p.vy;
    const k=1-p.t/p.life;
    const pr=p.r*(.4+k*.8);
    ctx.fillStyle=hsl(p.h,p.s===undefined?100:p.s,62,k);
    if(p.shape==='rect'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);
      ctx.fillRect(-pr,-pr*0.62,pr*2,pr*1.24);ctx.restore();
    }else if(p.shape==='star'){
      starPath(p.x,p.y,pr);ctx.fill();
    }else{ctx.beginPath();ctx.arc(p.x,p.y,pr,0,7);ctx.fill()}
  }
  ctx.globalCompositeOperation='source-over';
  if(dblOn){
    ctx.save();ctx.strokeStyle='rgba(255,210,63,'+(.3+.2*Math.sin(t*8)).toFixed(3)+')';ctx.lineWidth=5;
    ctx.shadowColor='#ff9a1f';ctx.shadowBlur=18;ctx.strokeRect(3,3,W-6,H-6);ctx.restore();
  }
  for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i];f.t+=dt;const k=f.t/600;
    if(k>=1){flashes.splice(i,1);continue}
    ctx.fillStyle='rgba(255,240,255,'+(0.32*(1-k)).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=texts.length-1;i>=0;i--){
    const o=texts[i];o.t+=dt;
    if(o.t>=o.life){texts.splice(i,1);continue}
    const k=Math.min(o.t/260,1),c1=1.70158,c3=c1+1;
    const sc=1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);
    const fade=o.t>o.life*.65?1-(o.t-o.life*.65)/(o.life*.35):1;
    const rise=o.big?0:o.t*.05;
    ctx.save();ctx.globalAlpha=Math.max(fade,0);ctx.translate(o.x,o.y-rise);ctx.scale(sc,sc);
    if(o.big)ctx.rotate(Math.sin(o.t*.02)*.04);
    ctx.font=`900 ${o.size}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.lineJoin='round';ctx.lineWidth=6;ctx.strokeStyle='rgba(20,5,50,.85)';ctx.strokeText(o.txt,0,0);
    ctx.shadowColor=o.col;ctx.shadowBlur=18;ctx.fillStyle=o.col;ctx.fillText(o.txt,0,0);
    ctx.restore();
  }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('blur',pause);
document.addEventListener('touchmove',e=>{
  if(e.target.closest&&(e.target.closest('#setp')||e.target.closest('#ov .panel')))return;
  e.preventDefault();
},{passive:false});
bindPlayer();
reset();showStart();
requestAnimationFrame(t=>{last=t;render(t)});
})();
</script>
